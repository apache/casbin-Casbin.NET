name: Release

# Releases are driven by manually pushed git tags (no automatic versioning):
#   v1.4.0-rc1  ->  GitHub pre-release only (the artifact used for the Apache vote)
#   v1.4.0      ->  GitHub release + push packages to the package registries
on:
  push:
    tags:
      - 'v*'

env:
  SHA: ${{ GITHUB.SHA }}
  REF: ${{ GITHUB.REF }}
  RUN_ID: ${{ GITHUB.RUN_ID }}
  RUN_NUMBER: ${{ GITHUB.RUN_NUMBER }}
  GITHUB_TOKEN: ${{ SECRETS.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          3.1.x
          5.0.x
          6.0.x
          7.0.x
          8.0.x
          9.0.x
        include-prerelease: true

    - name: Check .NET info
      run: dotnet --info

    - name: Install dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build -c Release --no-restore

    - name: Test solution
      run: dotnet test -c Release --no-build --no-restore --verbosity normal --results-directory test-results

    - name: Upload test results artefacts
      uses: actions/upload-artifact@v4
      with:
        name: "drop-ci-test-results"
        path: './test-results'

  github-release:
    runs-on: ubuntu-latest
    needs: build
    if: github.repository_owner == 'apache'

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^(.+)-[Rr][Cc][0-9]+$ ]]; then
            PRERELEASE=true
            BASE_VERSION="${BASH_REMATCH[1]}"
          else
            PRERELEASE=false
            BASE_VERSION="$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, version: $VERSION, base version: $BASE_VERSION, prerelease: $PRERELEASE"

      # The source package must carry the name the final release will have, so the
      # artifact voted on as a release candidate is bit-identical to the released one.
      # The release manager downloads it, signs it locally and uses it for the vote.
      - name: Create Apache source release package
        id: source
        run: |
          BASE_VERSION="${{ steps.version.outputs.base_version }}"
          NAME="apache-casbin-net-${BASE_VERSION}-incubating-src"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist/${NAME}.tar.gz" "${GITHUB_REF_NAME}"
          (cd dist && sha512sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha512")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Upload source release artefacts
        uses: actions/upload-artifact@v4
        with:
          name: "drop-ci-source-release"
          path: './dist'

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            "dist/${{ steps.source.outputs.name }}.tar.gz" \
            "dist/${{ steps.source.outputs.name }}.tar.gz.sha512"

  push-packages:
      runs-on: windows-latest
      needs: github-release
      # Release candidates are only voted on, they are never published to the registries.
      if: github.repository_owner == 'apache' && needs.github-release.outputs.prerelease == 'false'

      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Setup .NET SDK
          uses: actions/setup-dotnet@v4
          with:
            dotnet-version: |
              3.1.x
              5.0.x
              6.0.x
              7.0.x
              8.0.x
              9.0.x
            include-prerelease: true

        - name: Check .NET info
          run: dotnet --info

        - name: Install dependencies
          run: dotnet restore

        - name: Build solution
          run: dotnet build -c Release --no-restore

        - name: Pack packages
          run: |
            $Version = "${{ needs.github-release.outputs.version }}";
            echo "Publishing version: $Version";
            dotnet pack -c Release -o packages /p:PackageVersion=$Version /p:Version=$Version;

        - name: Upload packages artefacts
          uses: actions/upload-artifact@v4
          with:
            name: "drop-ci-packages"
            path: './packages'

        - name: Add github nuget source
          run: dotnet nuget add source https://nuget.pkg.github.com/apache/index.json --name github.com --username apache --password $env:GITHUB_TOKEN

        - name: Push packages to github.com
          run: dotnet nuget push .\packages\*.nupkg -s github.com -k $env:GITHUB_TOKEN --skip-duplicate --timeout 600;

        - name: Push packages to nuget.org
          env:
            NUGET_API_TOKEN: ${{ secrets.NUGET_API_KEY }}
          run: dotnet nuget push .\packages\*.nupkg -s nuget.org -k $env:NUGET_API_TOKEN --skip-duplicate
