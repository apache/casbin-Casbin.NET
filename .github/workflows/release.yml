name: Release candidate

# Final publication is a separate release-manager action after the applicable
# votes. Neither branch pushes nor final tags publish packages or moving aliases.
on:
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read

jobs:
  verify:
    if: github.repository_owner == 'apache'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag against committed package version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(\d+\.\d+\.\d+)-rc[1-9]\d*$') {
            throw 'Expected vMAJOR.MINOR.PATCH-rcN'
          }
          $version = $Matches[1]
          [xml]$project = Get-Content Casbin/Casbin.csproj -Raw
          $committedVersion = @($project.Project.PropertyGroup.Version | Where-Object { $_ })
          if ($committedVersion.Count -ne 1 -or $committedVersion[0] -cne $version) {
            throw 'The tag must match the committed Version in Casbin.csproj'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Checkout pinned conformance cases
        uses: actions/checkout@v4
        with:
          repository: apache/casbin
          ref: c92cc6a070e65dc621210c8d451de3092683cd1c
          path: casbin-conformance
          sparse-checkout: conformance
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            3.1.x
            5.0.x
            6.0.x
            7.0.x
            8.0.x
            9.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Test with conformance cases enabled
        env:
          CASBIN_CONFORMANCE_DIR: ${{ github.workspace }}/casbin-conformance/conformance
        run: dotnet test -c Release --no-build --no-restore --verbosity normal

  source:
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare source originals for release-manager review
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          NAME="apache-casbin-net-${VERSION}-incubating-src"
          mkdir dist
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist/${NAME}.tar.gz" HEAD
          (cd dist && sha512sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha512")
          cat DISCLAIMER > dist/release-notes.txt
          printf '\nRelease candidate for review. This is not an approved Apache release.\n\nThe release manager must review and sign the source archive, stage it at the ASF and obtain the applicable release votes. Final publication must reuse the approved originals; see RELEASING.md.\n' >> dist/release-notes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-candidate
          path: dist/
          if-no-files-found: error
      - name: Create candidate without changing latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Creation fails if the release already exists. Never clobber artifacts.
          gh release create "$TAG" --verify-tag --prerelease --latest=false \
            --title "Apache Casbin.NET (Incubating) $TAG" \
            --notes-file dist/release-notes.txt dist/*.tar.gz dist/*.sha512
